name: FB News Automation

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest news
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import urllib.parse

          feeds = {
              "PRATAPGARH": "Pratapgarh Uttar Pradesh",
              "UTTAR PRADESH": "Uttar Pradesh",
              "INDIA": "India",
              "INTERNATIONAL": "World International"
          }

          all_news = []

          for category, query in feeds.items():

              print("\n================================")
              print(category)
              print("================================")

              encoded = urllib.parse.quote(query + " when:1d")

              url = (
                  "https://news.google.com/rss/search?q="
                  + encoded
                  + "&hl=hi&gl=IN&ceid=IN%3Ahi"
              )

              try:
                  data = urllib.request.urlopen(
                      url, timeout=20
                  ).read()

                  root = ET.fromstring(data)

                  for item in root.findall("./channel/item")[:10]:

                      title = item.findtext("title", "")
                      link = item.findtext("link", "")
                      source = item.findtext("source", "")

                      print("\nTITLE:", title)
                      print("SOURCE:", source)
                      print("LINK:", link)

                      all_news.append(
                          (category, title, source, link)
                      )

              except Exception as e:
                  print("ERROR:", category, e)

          print("\n================================")
          print("TOTAL NEWS:", len(all_news))
          print("================================")
          PY
